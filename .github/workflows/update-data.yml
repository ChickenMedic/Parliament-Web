name: Update site data

on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC (8am EST) — inside the site's active window
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: npm ci
      - run: pip install -r requirements.txt

      # Each fetch continues on error so one flaky upstream doesn't block the rest.
      # --mps sweeps front-bench MPs daily and backbenchers on a 7-day rotation;
      # while X API credits are unavailable this fails harmlessly and resumes on
      # its own once credits are topped up.
      - name: Fetch X feeds (incl. MP sweep)
        continue-on-error: true
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: node fetch-tweets.js --mps

      - name: Fetch leader news
        continue-on-error: true
        run: python fetch_leader_news.py

      - name: Fetch bills
        continue-on-error: true
        run: python fetch_bills.py

      - name: Fetch committees
        continue-on-error: true
        run: python fetch_committees.py

      - name: Fetch senators
        continue-on-error: true
        run: python fetch_senators.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data twitter_user_ids.json
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Refresh site data"
            git pull --rebase origin master
            git push
          fi
