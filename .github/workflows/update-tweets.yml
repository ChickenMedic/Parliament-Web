name: Update feeds

on:
  schedule:
    # Every 4 hours during waking hours, quiet overnight (midnight-8am EST).
    # Cron is UTC; these are 8:15am, 12:15pm, 4:15pm, 8:15pm EST (fixed
    # offset — runs shift an hour earlier local time during daylight saving).
    - cron: '15 13,17,21,1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # continue-on-error: while X API credits are unavailable this step fails
      # harmlessly and the free feeds below still refresh; it resumes on its
      # own once credits are topped up.
      - name: Fetch curated X feeds
        continue-on-error: true
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: node fetch-tweets.js

      - name: Fetch news headlines
        continue-on-error: true
        run: python3 fetch_news.py

      - name: Fetch YouTube coverage
        continue-on-error: true
        run: python3 fetch_youtube.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data twitter_user_ids.json
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Refresh feeds"
            git pull --rebase origin master
            git push
          fi
